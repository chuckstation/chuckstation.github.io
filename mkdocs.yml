site_name: ChuckStation
site_url: https://chuckstation.github.io
repo_url: https://github.com/chuckstation/chuckstation.github.io/
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  icon:
    logo: material/sony-playstation

hooks:
  - tools/bitfields/hook.py

plugins:
  - search
  - with-pdf:
      output_path: chuckstation.pdf

extra_css:
  - css/extra.css

markdown_extensions:
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde

nav:
  - index.md